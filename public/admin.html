<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CareerDestiny — Admin</title>
<style>
  :root{ --bg:#f6f5f2; --card:#fff; --ink:#1a1a1a; --muted:#777; --line:#e6e3dc; --accent:#1D9E75; --err:#c0392b; --sidebar:#faf9f6; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);}
  #app{min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:240px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;}
  .sidebar-brand{font-size:15px;font-weight:600;padding:8px 10px 4px;}
  .sidebar-sub{font-size:11px;color:var(--muted);padding:0 10px 16px;}
  .nav-list{display:flex;flex-direction:column;gap:2px;}
  .nav-item{padding:9px 12px;border-radius:8px;font-size:13.5px;cursor:pointer;color:var(--ink);}
  .nav-item:hover{background:#efece4;}
  .nav-item.active{background:var(--ink);color:#fff;}
  .nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);padding:14px 12px 4px;}
  .sidebar-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
  .main{flex:1;min-width:0;padding:28px 36px;overflow-y:auto;}
  .main-title{font-size:16px;font-weight:600;margin:0 0 18px;}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;background:var(--ink);color:#fff;}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:100%;}
  input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .login-box{max-width:360px;margin:80px auto;}
  .login-box h2{margin-top:0;font-size:16px;}
  .login-box input{width:100%;margin-bottom:10px;}
  .error{color:var(--err);font-size:13px;margin-top:8px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s;}
  .stat:hover{border-color:var(--ink);}
  .stat .n{font-size:24px;font-weight:700;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.03em;}
  tr.clickable-row{cursor:pointer;}
  tr.clickable-row:hover td{background:#faf9f6;}
  .table-wrap{overflow-x:auto;}
  .loading,.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;}
  .clickable{cursor:pointer;color:var(--accent);}
  .msg-row{padding:8px 0;border-bottom:1px solid var(--line);}
  .msg-role{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:0.03em;}
  .msg-text{font-size:13px;margin-top:2px;white-space:pre-wrap;}
  .back-link{font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:14px;display:inline-block;}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type="text"]{flex:1;min-width:180px;}
  .filter-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;cursor:pointer;color:var(--ink);}
  .filter-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#eef3f0;color:var(--accent);}
  .badge.zero{background:#f0efec;color:var(--muted);}
  .placeholder-banner{background:#fff8e6;border:1px solid #f0dca0;color:#8a6d1d;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:18px;line-height:1.5;}
  .disabled-btn{opacity:0.45;cursor:not-allowed;pointer-events:none;}
  .mock{opacity:0.55;}
</style>
</head>
<body>
<div id="app">
  <div class="loading">Loading…</div>
</div>

<script>
var SESSION_KEY = 'cd_session';
var SUPABASE_URL = 'https://ybuqwggrkbtdubnzeecb.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidXF3Z2dya2J0ZHVibnplZWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIzOTcsImV4cCI6MjEwMzMxODM5N30.LOw-zbFjhVjvNVJcjeeMzJF2mFrUXb-tm10XcgAE8zg';
var SB_AUTH = SUPABASE_URL + '/auth/v1';

function getStoredSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function setStoredSession(s){ try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function ensureValidAccessToken(){
  var s = getStoredSession();
  if(!s || !s.access_token) return null;
  if(s.expires_at && Date.now() < (s.expires_at*1000 - 30000)) return s.access_token;
  try{
    var r = await fetch(SB_AUTH+'/token?grant_type=refresh_token', {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    var data = await r.json();
    if(!r.ok) throw new Error('refresh failed');
    setStoredSession({ access_token:data.access_token, refresh_token:data.refresh_token, expires_at:data.expires_at, user:data.user });
    return data.access_token;
  }catch(e){ setStoredSession(null); return null; }
}

async function adminFetch(action, extraParams){
  var token = await ensureValidAccessToken();
  if(!token) throw new Error('not-logged-in');
  var qs = 'action=' + encodeURIComponent(action) + (extraParams||'');
  var r = await fetch('/api/admin?' + qs, { headers:{ 'Authorization':'Bearer '+token } });
  var data = await r.json();
  if(!r.ok) throw new Error(data.error || ('HTTP '+r.status));
  return data;
}

var app = document.getElementById('app');

async function boot(){
  var token = await ensureValidAccessToken();
  if(!token){ renderLogin(); return; }
  try{
    var overview = await adminFetch('overview');
    renderDashboard(overview);
  }catch(e){
    if(e.message === 'not-logged-in'){ renderLogin(); }
    else { renderLogin('You are logged in, but not authorized to view this page.'); }
  }
}

function renderLogin(err){
  app.innerHTML =
    '<div class="login-box card">'
    + '<h2>CareerDestiny Admin</h2>'
    + '<input type="email" id="li-email" placeholder="Email"/>'
    + '<input type="password" id="li-pw" placeholder="Password"/>'
    + '<button onclick="doLogin()" style="width:100%;">Log in</button>'
    + (err ? '<div class="error">'+err+'</div>' : '<div class="error" id="li-err"></div>')
    + '</div>';
}

async function doLogin(){
  var email = document.getElementById('li-email').value.trim();
  var pw = document.getElementById('li-pw').value;
  var errEl = document.getElementById('li-err');
  try{
    var r = await fetch(SB_AUTH+'/token?grant_type=password', {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify({ email:email, password:pw })
    });
    var data = await r.json();
    if(!r.ok) throw new Error(data.error_description || data.msg || 'Login failed');
    setStoredSession({ access_token:data.access_token, refresh_token:data.refresh_token, expires_at:data.expires_at, user:data.user });
    boot();
  }catch(e){
    if(errEl) errEl.textContent = e.message;
  }
}

function logOut(){ setStoredSession(null); renderLogin(); }

// Visible in the sidebar
var TABS = [
  {id:'overview', label:'Overview'},
  {id:'leads', label:'Leads'},
  {id:'users', label:'Users'},
  {id:'chat_sessions', label:'Chat Sessions'},
  {id:'lead_revisits', label:'Revisits'}
];
// Reachable only by clicking an Overview card — a real view, just not
// important enough to take up permanent sidebar space.
var EXTRA_VIEWS = [
  {id:'chart_analyses', label:'Cached Chart Analyses'}
];
// Not built yet — previews only, so future scope is visible without
// pretending these are functional. See renderPlaceholder().
var PLACEHOLDER_TABS = [
  {id:'guest_approvals', label:'Guest Approvals'},
  {id:'coupons', label:'Coupons & Tokens'}
];

function renderDashboard(overview){
  app.innerHTML =
    '<div class="layout">'
    + '<div class="sidebar">'
    +   '<div class="sidebar-brand">CareerDestiny</div>'
    +   '<div class="sidebar-sub">Admin</div>'
    +   '<div class="nav-list" id="tabs"></div>'
    +   '<div class="nav-section-label">Coming soon</div>'
    +   '<div class="nav-list" id="tabs-placeholder"></div>'
    +   '<div class="sidebar-footer"><button class="ghost" onclick="logOut()">Log out</button></div>'
    + '</div>'
    + '<div class="main">'
    +   '<h2 class="main-title" id="main-title">Overview</h2>'
    +   '<div id="tab-content"></div>'
    + '</div>'
    + '</div>';
  var tabsEl = document.getElementById('tabs');
  TABS.forEach(function(t){
    var b = document.createElement('div');
    b.className = 'nav-item' + (t.id==='overview' ? ' active' : '');
    b.textContent = t.label;
    b.onclick = function(){ switchTab(t.id); };
    b.dataset.tab = t.id;
    tabsEl.appendChild(b);
  });
  var placeholderEl = document.getElementById('tabs-placeholder');
  PLACEHOLDER_TABS.forEach(function(t){
    var b = document.createElement('div');
    b.className = 'nav-item';
    b.textContent = t.label;
    b.onclick = function(){ switchTab(t.id); };
    b.dataset.tab = t.id;
    placeholderEl.appendChild(b);
  });
  renderOverview(overview);
}

function tabLabel(id){
  var all = TABS.concat(EXTRA_VIEWS).concat(PLACEHOLDER_TABS);
  var t = all.find(function(x){return x.id===id;});
  return t ? t.label : id;
}

function switchTab(id){
  document.querySelectorAll('.nav-item').forEach(function(t){ t.classList.toggle('active', t.dataset.tab===id); });
  var titleEl = document.getElementById('main-title');
  if(titleEl){ titleEl.textContent = tabLabel(id); }
  var content = document.getElementById('tab-content');
  content.innerHTML = '<div class="loading">Loading…</div>';
  if(id==='guest_approvals' || id==='coupons'){
    renderPlaceholder(id);
  } else if(id==='overview'){
    adminFetch('overview').then(renderOverview).catch(showErr);
  } else if(id==='leads'){
    renderLeadsTab();
  } else if(id==='users'){
    renderUsersTab();
  } else if(id==='chat_sessions'){
    renderChatSessionsTab();
  } else if(id==='lead_revisits'){
    adminFetch('lead_revisits').then(renderRevisitsTable).catch(showErr);
  } else if(id==='chart_analyses'){
    adminFetch('chart_analyses').then(renderChartAnalysesTable).catch(showErr);
  }
}

function showErr(e){
  document.getElementById('tab-content').innerHTML = '<div class="empty">Error: '+e.message+'</div>';
}

// Lead source values come from visitor-controlled URLs, so always escape.
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

// One readable label per lead: tagged source, else referring site, else direct.
function leadSource(l){
  if(l.utm_source) return l.utm_source + (l.utm_medium ? ' / '+l.utm_medium : '');
  if(l.gclid) return 'google ads';
  if(l.fbclid) return 'facebook / instagram';
  if(l.referrer){ try{ return new URL(l.referrer).host.replace(/^www\./,''); }catch(e){ return l.referrer; } }
  return 'direct';
}

function fmtDate(s){
  if(!s) return '—';
  try{ return new Date(s).toLocaleString('en-IN', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; }
}

// ── Overview ─────────────────────────────────────────────────────────
function renderOverview(o){
  var content = document.getElementById('tab-content');
  var stats = [
    {n:o.totalLeads, l:'Total leads', go:'leads'},
    {n:o.leadsLast24h, l:'Leads (last 24h)', go:'leads', filter:'24h'},
    {n:o.totalUsers, l:'Signed-up users', go:'users'},
    {n:o.totalChatSessions, l:'Saved chat sessions', go:'chat_sessions'},
    {n:o.totalChartAnalyses, l:'Cached chart analyses', go:'chart_analyses'},
    {n:o.totalRevisitProfiles, l:'Revisit-tracked profiles', go:'lead_revisits'},
    {n:o.totalRevisits, l:'Total visits tracked', go:'lead_revisits'},
    {n:o.totalLeadMessages, l:'Anonymous chat messages', go:'leads', filter:'chatted'}
  ];
  content.innerHTML = '<div class="stat-grid">' + stats.map(function(s, i){
    return '<div class="stat" data-idx="'+i+'"><div class="n">'+s.n+'</div><div class="l">'+s.l+'</div></div>';
  }).join('') + '</div>';
  content.querySelectorAll('.stat').forEach(function(el){
    var s = stats[+el.dataset.idx];
    el.onclick = function(){ switchTab(s.go); if(s.go==='leads' && s.filter){ setTimeout(function(){ applyLeadsFilter(s.filter); }, 60); } };
  });
}

// ── Leads (with search + filters, folds in anonymous chat messages) ──
var _leadsCache = null, _leadMessageCounts = null, _leadsFilter = 'all', _leadsSearch = '', _leadsSource = '';

async function renderLeadsTab(){
  var content = document.getElementById('tab-content');
  try{
    var leads = await adminFetch('leads');
    var messages = await adminFetch('lead_messages');
    var counts = {};
    messages.forEach(function(m){ counts[m.lead_id] = (counts[m.lead_id]||0) + 1; });
    _leadsCache = leads; _leadMessageCounts = counts;
    content.innerHTML =
      '<div class="toolbar">'
      + '<input type="text" id="leads-search" placeholder="Search name, email, or place…"/>'
      + '<div class="filter-chip" data-f="all">All</div>'
      + '<div class="filter-chip" data-f="24h">Last 24h</div>'
      + '<div class="filter-chip" data-f="7d">Last 7 days</div>'
      + '<div class="filter-chip" data-f="chatted">Has chat</div>'
      + '<select id="leads-source"><option value="">All sources</option>'
      +   sourceOptions(leads)
      + '</select>'
      + '</div>'
      + '<div id="leads-table"></div>';
    document.getElementById('leads-search').oninput = function(){ _leadsSearch = this.value.toLowerCase(); renderLeadsTable(); };
    var srcSel = document.getElementById('leads-source');
    srcSel.value = _leadsSource;
    srcSel.onchange = function(){ _leadsSource = this.value; renderLeadsTable(); };
    content.querySelectorAll('.filter-chip').forEach(function(chip){
      chip.onclick = function(){ applyLeadsFilter(chip.dataset.f); };
    });
    applyLeadsFilter('all');
  }catch(e){ showErr(e); }
}

// Source dropdown options with lead counts, most common first.
function sourceOptions(leads){
  var counts = {};
  leads.forEach(function(l){ var s = leadSource(l); counts[s] = (counts[s]||0) + 1; });
  return Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).map(function(s){
    return '<option value="'+esc(s)+'">'+esc(s)+' ('+counts[s]+')</option>';
  }).join('');
}

function applyLeadsFilter(f){
  _leadsFilter = f;
  document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.toggle('active', c.dataset.f===f); });
  renderLeadsTable();
}

function renderLeadsTable(){
  var wrap = document.getElementById('leads-table');
  if(!wrap || !_leadsCache) return;
  var now = Date.now();
  var rows = _leadsCache.filter(function(l){
    if(_leadsFilter==='24h' && now - new Date(l.created_at).getTime() > 24*60*60*1000) return false;
    if(_leadsFilter==='7d' && now - new Date(l.created_at).getTime() > 7*24*60*60*1000) return false;
    if(_leadsFilter==='chatted' && !_leadMessageCounts[l.id]) return false;
    if(_leadsSource && leadSource(l) !== _leadsSource) return false;
    if(_leadsSearch){
      var hay = ((l.name||'')+' '+(l.email||'')+' '+(l.place_of_birth||'')).toLowerCase();
      if(hay.indexOf(_leadsSearch) === -1) return false;
    }
    return true;
  });
  if(!rows.length){ wrap.innerHTML = '<div class="empty">No matching leads.</div>'; return; }
  var html = '<div class="card table-wrap"><table><thead><tr>'
    + '<th>Name</th><th>Email</th><th>DOB</th><th>Time</th><th>Place</th><th>Verdict</th><th>Biz</th><th>Job</th><th>Source</th><th>Messages</th><th>Created</th>'
    + '</tr></thead><tbody>';
  rows.forEach(function(l){
    var mc = _leadMessageCounts[l.id] || 0;
    html += '<tr class="clickable-row" onclick="renderLeadDetail(\''+l.id+'\')">'
      + '<td>'+(l.name||'—')+'</td><td>'+(l.email||'—')+'</td><td>'+(l.dob||'')+'</td><td>'+(l.time_of_birth||'')+'</td>'
      + '<td>'+(l.place_of_birth||'')+'</td><td>'+(l.verdict||'')+'</td><td>'+(l.biz_score!=null?l.biz_score:'')+'</td><td>'+(l.job_score!=null?l.job_score:'')+'</td>'
      + '<td>'+esc(leadSource(l))+'</td>'
      + '<td>'+(mc ? '<span class="badge">'+mc+'</span>' : '<span class="badge zero">0</span>')+'</td>'
      + '<td>'+fmtDate(l.created_at)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

async function renderLeadDetail(leadId){
  var content = document.getElementById('tab-content');
  content.innerHTML = '<div class="loading">Loading…</div>';
  var lead = _leadsCache.find(function(l){ return l.id===leadId; });
  try{
    var messages = (_leadMessageCounts[leadId]) ? await adminFetch('lead_messages', '&lead_id='+encodeURIComponent(leadId)) : [];
    var html = '<span class="back-link" onclick="renderLeadsTab()">&larr; Back to Leads</span>'
      + '<div class="card">'
      +   '<h3 style="margin-top:0;">'+(lead.name||'—')+'</h3>'
      +   '<div style="font-size:13px;color:var(--muted);line-height:1.8;">'
      +     'Email: '+(lead.email||'—')+'<br/>'
      +     'DOB: '+(lead.dob||'—')+' at '+(lead.time_of_birth||'—')+'<br/>'
      +     'Place: '+(lead.place_of_birth||'—')+'<br/>'
      +     'Verdict: '+(lead.verdict||'—')+' (Biz '+lead.biz_score+' / Job '+lead.job_score+')<br/>'
      +     'Submitted: '+fmtDate(lead.created_at)+'<br/>'
      +     'Source: '+esc(leadSource(lead))
      +       (lead.utm_campaign ? ' · campaign: '+esc(lead.utm_campaign) : '')
      +       (lead.utm_content ? ' · content: '+esc(lead.utm_content) : '')+'<br/>'
      +     'Referrer: '+esc(lead.referrer||'—')+'<br/>'
      +     'Landing page: '+esc(lead.landing_page||'—')+'<br/>'
      +     'First seen: '+fmtDate(lead.first_seen_at)
      +       (lead.last_touch && leadSource(lead.last_touch) !== leadSource(lead) ? '<br/>Latest visit from: '+esc(leadSource(lead.last_touch)) : '')
      +   '</div>'
      + '</div>';
    if(messages.length){
      html += '<div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Conversation</div>';
      messages.forEach(function(m){
        html += '<div class="msg-row"><div class="msg-role">'+m.role+'</div><div class="msg-text">'+(m.text||'').replace(/</g,'&lt;')+'</div></div>';
      });
      html += '</div>';
    }
    content.innerHTML = html;
  }catch(e){ showErr(e); }
}

// ── Users (signed-up accounts, mapped to their profiles + chats) ────
async function renderUsersTab(){
  var content = document.getElementById('tab-content');
  try{
    var users = await adminFetch('users');
    if(!users.length){ content.innerHTML = '<div class="empty">No signed-up users yet.</div>'; return; }
    var html = '<div class="card table-wrap"><table><thead><tr><th>Email</th><th>Profiles</th><th>Primary profile</th><th>Signed up</th><th>Last sign-in</th></tr></thead><tbody>';
    users.forEach(function(u){
      var p = u.primaryProfile;
      var preview = p ? ((p.name||'—')+' · '+(p.dob||'—')+' · '+(p.place||'—')) : '—';
      html += '<tr class="clickable-row" onclick="renderUserDetail(\''+u.id+'\',\''+(u.email||'').replace(/'/g,"\\'")+'\')">'
        + '<td>'+(u.email||'—')+'</td>'
        + '<td>'+(u.profileCount ? '<span class="badge">'+u.profileCount+'</span>' : '<span class="badge zero">0</span>')+'</td>'
        + '<td>'+preview+'</td>'
        + '<td>'+fmtDate(u.created_at)+'</td><td>'+fmtDate(u.last_sign_in_at)+'</td></tr>';
    });
    html += '</tbody></table></div>';
    content.innerHTML = html;
  }catch(e){ showErr(e); }
}

async function renderUserDetail(userId, email){
  var content = document.getElementById('tab-content');
  content.innerHTML = '<div class="loading">Loading…</div>';
  try{
    var detail = await adminFetch('user_detail', '&user_id='+encodeURIComponent(userId));
    var html = '<span class="back-link" onclick="renderUsersTab()">&larr; Back to Users</span>'
      + '<div class="card"><h3 style="margin-top:0;">'+email+'</h3></div>';
    html += '<div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Birth chart profiles ('+detail.profiles.length+')</div>';
    if(!detail.profiles.length){ html += '<div class="empty" style="padding:10px 0;">None yet.</div>'; }
    else{
      html += '<table><thead><tr><th>Label</th><th>Name</th><th>DOB</th><th>Place</th></tr></thead><tbody>';
      detail.profiles.forEach(function(p){
        html += '<tr><td>'+(p.label||'—')+'</td><td>'+(p.name||'—')+'</td><td>'+(p.dob||'—')+'</td><td>'+(p.place||'—')+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    html += '<div class="card"><div style="font-size:13px;color:var(--muted);margin-bottom:8px;">Saved chats ('+detail.chatSessions.length+')</div>';
    if(!detail.chatSessions.length){ html += '<div class="empty" style="padding:10px 0;">None yet.</div>'; }
    else{
      html += '<table><thead><tr><th>Title</th><th>Updated</th></tr></thead><tbody>';
      detail.chatSessions.forEach(function(c){
        html += '<tr class="clickable-row" onclick="renderChatSessionDetail(\''+c.id+'\')"><td>'+(c.title||'—')+'</td><td>'+fmtDate(c.updated_at)+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    content.innerHTML = html;
  }catch(e){ showErr(e); }
}

// ── Chat sessions (logged-in users' saved chats) ─────────────────────
async function renderChatSessionsTab(){
  var content = document.getElementById('tab-content');
  try{
    var rows = await adminFetch('chat_sessions');
    if(!rows.length){ content.innerHTML = '<div class="empty">No saved chats yet.</div>'; return; }
    var html = '<div class="card table-wrap"><table><thead><tr><th>Title</th><th>Subtitle</th><th>Updated</th></tr></thead><tbody>';
    rows.forEach(function(c){
      html += '<tr class="clickable-row" onclick="renderChatSessionDetail(\''+c.id+'\')"><td>'+(c.title||'—')+'</td><td>'+(c.subtitle||'—')+'</td><td>'+fmtDate(c.updated_at)+'</td></tr>';
    });
    html += '</tbody></table></div>';
    content.innerHTML = html;
  }catch(e){ showErr(e); }
}

async function renderChatSessionDetail(id){
  var content = document.getElementById('tab-content');
  content.innerHTML = '<div class="loading">Loading…</div>';
  try{
    var session = await adminFetch('chat_session_detail', '&id='+encodeURIComponent(id));
    var html = '<span class="back-link" onclick="switchTab(\'chat_sessions\')">&larr; Back to Chat Sessions</span>'
      + '<div class="card"><h3 style="margin-top:0;">'+(session.title||'—')+'</h3>';
    (session.messages||[]).forEach(function(m){
      html += '<div class="msg-row"><div class="msg-role">'+m.role+'</div><div class="msg-text">'+(m.text||'').replace(/</g,'&lt;')+'</div></div>';
    });
    html += '</div>';
    content.innerHTML = html;
  }catch(e){ showErr(e); }
}

// ── Revisits ─────────────────────────────────────────────────────────
function renderRevisitsTable(rows){
  var content = document.getElementById('tab-content');
  if(!rows.length){ content.innerHTML = '<div class="empty">No revisit data yet.</div>'; return; }
  var html = '<div class="card table-wrap"><table><thead><tr><th>DOB</th><th>Time</th><th>Place</th><th>Visits</th><th>Revisits &gt;6h</th><th>First seen</th><th>Last seen</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html += '<tr><td>'+(r.dob||'')+'</td><td>'+(r.time_of_birth||'')+'</td><td>'+(r.place_of_birth||'')+'</td>'
      + '<td>'+r.visit_count+'</td><td>'+(r.revisits_after_6h||0)+'</td><td>'+fmtDate(r.first_seen_at)+'</td><td>'+fmtDate(r.last_seen_at)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  content.innerHTML = html;
}

// ── Cached chart analyses (secondary view, reached from Overview only) ─
function renderChartAnalysesTable(rows){
  var content = document.getElementById('tab-content');
  if(!rows.length){ content.innerHTML = '<div class="empty">No cached analyses yet.</div>'; return; }
  var html = '<div class="card table-wrap"><table><thead><tr><th>Verdict</th><th>Biz</th><th>Job</th><th>Computed</th></tr></thead><tbody>';
  rows.forEach(function(r){
    html += '<tr><td>'+(r.verdict||'')+'</td><td>'+(r.biz_score!=null?r.biz_score:'')+'</td><td>'+(r.job_score!=null?r.job_score:'')+'</td><td>'+fmtDate(r.computed_at)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  content.innerHTML = html;
}
